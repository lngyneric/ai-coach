<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看板引擎 · AI-Coach</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--brand:#0f63ee;--bg:#f8f9fb;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--green:#10b981;--amber:#f59e0b;--purple:#8b5cf6;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between}
header h2{font-size:1rem;font-weight:700}
.toolbar{display:flex;gap:6px}
.toolbar button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:.78rem;cursor:pointer;transition:all .15s}
.toolbar button:hover{border-color:var(--brand);color:var(--brand)}
.toolbar button.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* grid engine */
.grid-engine{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(12,1fr);gap:12px;min-height:70vh}
.widget{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:box-shadow .2s;cursor:grab;position:relative}
.widget:hover{box-shadow:0 4px 20px rgba(0,0,0,.08)}
.widget.dragging{opacity:.5;cursor:grabbing}
.widget .handle{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.widget:hover .handle{opacity:1}
.widget .handle button{width:24px;height:24px;border:none;border-radius:4px;background:var(--bg);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.widget .handle button:hover{background:var(--border)}
.widget h3{font-size:.9rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.col-3{grid-column:span 3}
.col-4{grid-column:span 4}
.col-6{grid-column:span 6}
.col-12{grid-column:span 12}

/* drag ghost */
.ghost{opacity:.3;background:var(--brand)}

/* widget content */
.stat-big{font-size:2.5rem;font-weight:900;color:var(--brand);line-height:1}
.stat-sub{font-size:.78rem;color:var(--muted);margin-top:2px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.72rem;padding:4px 10px;border-radius:99px;font-weight:600}

/* progress mini */
.prog-mini{display:flex;flex-direction:column;gap:6px}
.prog-mini .row{display:flex;align-items:center;gap:6px;font-size:.78rem}
.prog-mini .row .name{width:50px;text-align:right;font-weight:500}
.prog-mini .row .bar{flex:1;height:8px;background:#f1f5f9;border-radius:4px;overflow:hidden}
.prog-mini .row .bar div{height:100%;border-radius:4px}

/* timeline */
.tl{font-size:.78rem}
.tl .item{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border)}
.tl .item:last-child{border-bottom:none}
.tl .item .icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.tl .item .icon.done{background:#ecfdf5;color:var(--green)}
.tl .item .icon.active{background:#eff6ff;color:var(--brand)}
.tl .item .time{color:var(--muted);flex-shrink:0}

/* drop zone indicator */
.drop-target{border:2px dashed var(--brand)!important;background:#eff6ff!important}

@media(max-width:900px){.col-3,.col-4,.col-6{grid-column:span 6}.col-12{grid-column:span 12}}
@media(max-width:600px){.col-3,.col-4,.col-6,.col-12{grid-column:span 12}}
</style>
</head>
<body>

<header>
  <a href="/portal.html" style="text-decoration:none;color:var(--text);font-weight:700;font-size:.85rem">← 门户</a>
  <h2>📊 看板引擎</h2>
  <div class="toolbar">
    <button onclick="addWidget('stats')">+ 统计卡</button>
    <button onclick="addWidget('progress')">+ 进度条</button>
    <button onclick="addWidget('timeline')">+ 时间线</button>
    <button onclick="resetLayout()" style="border-color:var(--amber);color:var(--amber)">重置布局</button>
  </div>
</header>

<div class="grid-engine" id="engine"></div>

<script>
// ── Widget templates ──
const templates = {
  stats: `<h3><span class="dot" style="background:var(--brand);width:8px;height:8px;border-radius:50%"></span>关键指标</h3>
    <div class="stat-big" id="s1">3</div><div class="stat-sub">在带学员</div>
    <div class="stat-big" id="s2" style="color:var(--amber);margin-top:8px">4</div><div class="stat-sub">待评分项</div>`,
  progress: `<h3><span class="dot" style="background:var(--green);width:8px;height:8px;border-radius:50%"></span>验收进度</h3>
    <div class="prog-mini">
      <div class="row"><span class="name">张伟</span><div class="bar"><div style="width:25%;background:var(--brand)"></div></div><span style="font-size:.7rem">3/12</span></div>
      <div class="row"><span class="name">李娜</span><div class="bar"><div style="width:41%;background:var(--green)"></div></div><span style="font-size:.7rem">7/17</span></div>
      <div class="row"><span class="name">王芳</span><div class="bar"><div style="width:100%;background:var(--purple)"></div></div><span style="font-size:.7rem">38/38</span></div>
    </div>`,
  timeline: `<h3><span class="dot" style="background:var(--purple);width:8px;height:8px;border-radius:50%"></span>最近动态</h3>
    <div class="tl">
      <div class="item"><span class="icon done">✓</span><span>张伟 · 血球考试 · 4分</span><span class="time">2h前</span></div>
      <div class="item"><span class="icon active">●</span><span>李娜 · Alifax考试 · 待评分</span><span class="time">1d前</span></div>
      <div class="item"><span class="icon done">✓</span><span>王芳 · 全部阶段完成</span><span class="time">3d前</span></div>
    </div>`
};

// ── Default layout (persisted in localStorage) ──
const defaultLayout = [
  {id:'stats',col:'col-3'},{id:'progress',col:'col-4'},{id:'timeline',col:'col-5'},
  {id:'stats2',col:'col-6'},{id:'progress2',col:'col-6'}
];

function loadLayout() {
  try { return JSON.parse(localStorage.getItem('dashboard-layout')) || defaultLayout; }
  catch { return defaultLayout; }
}

function saveLayout() {
  const widgets = [...document.querySelectorAll('.widget')];
  const layout = widgets.map(w => ({id:w.dataset.wid, col:w.className.match(/col-\d+/)?.[0]||'col-4'}));
  localStorage.setItem('dashboard-layout', JSON.stringify(layout));
}

function renderLayout() {
  const engine = document.getElementById('engine');
  const layout = loadLayout();
  engine.innerHTML = '';
  layout.forEach(item => {
    const w = document.createElement('div');
    w.className = `widget ${item.col}`;
    w.draggable = true;
    w.dataset.wid = item.id;
    w.innerHTML = `<div class="handle"><button title="删除" onclick="removeWidget(this)">✕</button></div>${templates[item.id.includes('stats')?'stats':item.id.includes('progress')?'progress':'timeline']}`;
    w.addEventListener('dragstart',onDragStart);
    w.addEventListener('dragover',onDragOver);
    w.addEventListener('dragleave',onDragLeave);
    w.addEventListener('drop',onDrop);
    w.addEventListener('dragend',onDragEnd);
    engine.appendChild(w);
  });
}

// ── Drag & Drop ──
let dragged = null;

function onDragStart(e) {
  dragged = this;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  this.classList.add('drop-target');
}

function onDragLeave() { this.classList.remove('drop-target'); }

function onDrop(e) {
  e.preventDefault();
  this.classList.remove('drop-target');
  if (dragged !== this) {
    const engine = document.getElementById('engine');
    const children = [...engine.children];
    const fromIdx = children.indexOf(dragged);
    const toIdx = children.indexOf(this);
    if (fromIdx < toIdx) engine.insertBefore(dragged, this.nextSibling);
    else engine.insertBefore(dragged, this);
    saveLayout();
  }
}

function onDragEnd() {
  this.classList.remove('dragging');
  document.querySelectorAll('.drop-target').forEach(e=>e.classList.remove('drop-target'));
}

// ── Widget CRUD ──
function addWidget(type) {
  const engine = document.getElementById('engine');
  const w = document.createElement('div');
  w.className = 'widget col-4';
  w.draggable = true;
  w.dataset.wid = type + Date.now();
  w.innerHTML = `<div class="handle"><button title="删除" onclick="removeWidget(this)">✕</button></div>${templates[type]}`;
  w.addEventListener('dragstart',onDragStart);
  w.addEventListener('dragover',onDragOver);
  w.addEventListener('dragleave',onDragLeave);
  w.addEventListener('drop',onDrop);
  w.addEventListener('dragend',onDragEnd);
  engine.appendChild(w);
  saveLayout();
}

function removeWidget(btn) {
  btn.closest('.widget').remove();
  saveLayout();
}

function resizeWidget(btn, col) {
  const w = btn.closest('.widget');
  w.className = w.className.replace(/col-\d+/,'col-'+col);
  saveLayout();
}

function resetLayout() {
  localStorage.removeItem('dashboard-layout');
  renderLayout();
}

renderLayout();
</script>

</body>
</html>
