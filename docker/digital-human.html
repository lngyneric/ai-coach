<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Coach 数字人 · Pi Agent</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--brand:#0f63ee;--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;--green:#10b981}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:rgba(15,23,42,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
header h2{font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:8px}
header .status{font-size:.7rem;display:flex;align-items:center;gap:4px}
header .status .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
main{flex:1;overflow-y:auto;padding:20px;max-width:800px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.bubble{max-width:85%;padding:12px 16px;border-radius:16px;font-size:.9rem;line-height:1.6;animation:fadeUp .3s ease}
.bubble.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
.bubble.user{align-self:flex-end;background:var(--brand);border-bottom-right-radius:4px}
.bubble.ai .label{font-size:.7rem;color:var(--muted);margin-bottom:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.typing{display:inline-block;width:6px;height:14px;background:var(--muted);animation:blink .8s infinite;vertical-align:middle;margin-left:2px}
@keyframes blink{50%{opacity:0}}
footer{flex-shrink:0;background:var(--card);border-top:1px solid var(--border);padding:12px 20px;display:flex;gap:8px;max-width:800px;width:100%;margin:0 auto}
footer textarea{flex:1;background:transparent;border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text);font-size:.88rem;resize:none;outline:none;font-family:inherit;max-height:80px}
footer textarea:focus{border-color:var(--brand)}
footer button{background:var(--brand);color:#fff;border:none;border-radius:12px;padding:0 20px;font-weight:600;cursor:pointer;font-size:.88rem;transition:opacity .15s}
footer button:hover{opacity:.9}
footer button:disabled{opacity:.4}
</style>
</head>
<body>

<header>
  <a href="/portal.html" style="color:var(--muted);text-decoration:none;font-size:.8rem">← 门户</a>
  <h2>🤖 AI-Coach 数字人<span style="font-weight:400;font-size:.7rem;color:var(--muted)"> · Pi Agent</span></h2>
  <div class="status"><span class="dot"></span>在线</div>
</header>

<details style="max-width:800px;margin:0 auto 0;padding:0 20px;font-size:.78rem;color:var(--muted)"><summary style="cursor:pointer">📋 对话日志</summary><div id="conversationLog" style="margin-top:4px;max-height:200px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.7rem;font-family:monospace;color:var(--muted);line-height:1.5;white-space:pre-wrap">等待对话...</div></details>
<main id="chat"></main>

<footer>
  <textarea id="input" rows="1" placeholder="输入问题，如：张伟的培训进度如何？" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
  <button id="sendBtn" onclick="send()">发送</button>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
let currentAiBubble = null;
  const elog = document.getElementById('conversationLog');
let fullResponse = '';
let controller = null;

function addBubble(text, role) {
  const d = document.createElement('div');
  d.className = 'bubble ' + role;
  if (role === 'ai') d.innerHTML = '<div class="label">🤖 Pi Agent</div>' + text;
  else d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  elog.textContent += '\n[Q] ' + text;
    elog.scrollTop = elog.scrollHeight;
    input.value = '';
  sendBtn.disabled = true;
  fullResponse = '';

  addBubble(text, 'user');
  currentAiBubble = addBubble('<span class="typing"></span>', 'ai');

  controller = new AbortController();

  try {
    const res = await fetch('/api/pi/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
      signal: controller.signal
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') break;
        try {
          const msg = JSON.parse(data);
          if (msg.type === 'text_delta' && msg.text) {
            fullResponse += msg.text;
            if (msg.text && !msg.final) {
              elog.textContent += msg.text;
              elog.scrollTop = elog.scrollHeight;
            }
            currentAiBubble.innerHTML = '<div class="label">🤖 Pi Agent</div>' + fullResponse.replace(/\n/g, '<br>');
            chat.scrollTop = chat.scrollHeight;
          }
        } catch {}
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      currentAiBubble.innerHTML = '<div class="label">🤖 Pi Agent</div>连接失败，请重试';
    }
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}
</script>
</body>
</html>
